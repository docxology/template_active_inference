[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_active_inference"
version = "0.3.2"
license = {text = "MIT"}
description = "Multi-track Active Inference exemplar: analytical + pymdp + sheaf manuscript + Lean/GNN/ontology. Track/fragment counts are registry-backed (docs/manuscript/sheaf/tracks.yaml); not hard-coded here."
authors = [{ name = "Daniel Ari Friedman", email = "daniel@activeinference.institute" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "matplotlib>=3.10.9",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    # WHY: pymdp 1.0.4 changes the A-matrix convention and breaks the SI runner
    # (agent init IndexError on stacked A). Re-run scripts/simulate_si_tmaze.py
    # and tests/test_si_runner.py before moving this pin.
    "inferactively-pymdp==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "requires_pymdp: tests that import inferactively-pymdp",
    "long_running: end-to-end or heavy test families that take minutes",
    "slow: tests retained for release profiles but omitted from the quick inner loop",
    "requires_gate_artifacts: tests that consume the real-tree hydrated gate-artifact cache",
    "timeout(seconds): per-test timeout for artifact write/validate isolation checks",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2

[tool.uv]
