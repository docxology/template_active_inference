[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_active_inference"
version = "0.3.2"
license = {text = "MIT"}
description = "Multi-track Active Inference exemplar: analytical + pymdp + sheaf manuscript + Lean/GNN/ontology. Track/fragment counts are registry-backed (docs/manuscript/sheaf/tracks.yaml); not hard-coded here."
authors = [{ name = "Daniel Ari Friedman", email = "daniel@activeinference.institute" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.6",
    "matplotlib>=3.10.9",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    # WHY: this release produced the tracked T-maze evidence and accepts the
    # NumPy model factors used by the runner. PyMDP 1.x takes JAX factor lists.
    "inferactively-pymdp==0.0.7.1",
    # The NumPy-era PyMDP release no longer brings JAX in transitively.
    # Keep the locked backend used by the tracked runtime diagnostics.
    "jax==0.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "requires_pymdp: tests that import inferactively-pymdp",
    "long_running: end-to-end or heavy test families that take minutes",
    "slow: tests retained for release profiles but omitted from the quick inner loop",
    "requires_gate_artifacts: tests that consume the real-tree hydrated gate-artifact cache",
    "timeout(seconds): per-test timeout for artifact write/validate isolation checks",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2

[tool.uv]
